spring:
  application.name: spring-mqtt-sensor-ingestion
  datasource:
    url: jdbc:h2:file:./data/mqtt-ingestion;MODE=PostgreSQL;AUTO_SERVER=TRUE
    username: sa
    password:
  jpa:
    hibernate.ddl-auto: update
    open-in-view: false
  h2.console:
    enabled: true
    path: /h2-console
app:
  mqtt:
    enabled: ${MQTT_ENABLED:true}
    url: ${MQTT_URL:tcp://192.168.200.60:1883}
    client-id: ${MQTT_CLIENT_ID:spring-mqtt-sensor-ingestion}
    username: ${MQTT_USERNAME:}
    password: ${MQTT_PASSWORD:}
    topics: [ iot/+/+/telemetry, iot/+/+/state ]
    qos: [ 1 ]
    automatic-reconnect: true
    clean-session: false
    completion-timeout: 5s
  aggregation.cron: '0 * * * * *'
management.endpoints.web.exposure.include: health,info,metrics,integrationgraph
server.port: 8083
